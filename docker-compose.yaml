version: '3'
services:
  django:
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn base.wsgi:application --bind 0.0.0.0:8000
    working_dir: /code/gimtpetinvoice
    env_file:
      - dev.env
    tty: true
    stdin_open: true
    volumes:
      - static_volume:/code/gimtpetinvoice/staticfiles
      - ./entrypoint.sh:/code/entrypoint.sh:ro
    ports:
      - 8000:8000
    depends_on:
      - db
    restart: always
  db:
    image: postgres
    environment:
      - POSTGRES_USER=invoiceadmin
      - POSTGRES_PASSWORD=invoicesafepass
      - POSTGRES_DB=invoicedb
    volumes:
      - ./db_init/db_init:/docker-entrypoint-initdb.d
    ports:
      - 55432:5432
    tty: true
    stdin_open: true
  nginx:
    build: ./nginx
    volumes:
      - static_volume:/code/gimtpetinvoice/staticfiles
    ports:
      - 1337:80
    depends_on:
      - django
  redis:  
    image: redis
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - 6379:6379
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin 
      - RABBITMQ_DEFAULT_PASS=admin
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data:
  static_volume:
