services:

  django:
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn base.wsgi:application --bind 0.0.0.0:8000
    working_dir: /code/gimtpetinvoice
    environment:
      - DJANGO_ENV=dev
      - DJANGO_SETTINGS_MODULE=base.settings
    tty: true
    stdin_open: true
    volumes:
      - ./:/code
      - static_volume:/code/gimtpetinvoice/staticfiles
    ports:
      - 8000:8000
    depends_on:
      - db
    restart: always

  db:
    image: postgres
    environment:
      - POSTGRES_USER=invoiceadmin
      - POSTGRES_PASSWORD=invoicesafepass
      - POSTGRES_DB=invoicedb
    volumes:
      - ./db_init:/docker-entrypoint-initdb.d
      - ./pgdata:/etc/data
    ports:
      - 55432:5432
    tty: true
    stdin_open: true

  nginx:
    build: ./nginx
    volumes:
      - static_volume:/code/gimtpetinvoice/staticfiles
    ports:
      - 1337:80
    depends_on:
      - django

  redis:
    image: redis
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - 6379:6379

  celery:
    build:
      context: .
    working_dir: /code/gimtpetinvoice
    env_file:
      - dev.env
    command: celery -A base worker --loglevel=info -Q default
    volumes:
      - .:/code
    depends_on:
      - redis

volumes:
  postgres_data:
  static_volume:
